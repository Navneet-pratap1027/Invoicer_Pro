name: InvoicerPro CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  # ── 1. BUILD & TEST
  test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps

      - name: Build client
        run: cd client && npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          REACT_APP_API: ${{ secrets.REACT_APP_API }}
          REACT_APP_URL: ${{ secrets.REACT_APP_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          DISABLE_ESLINT_PLUGIN: true

  # ── 2. DOCKER BUILD & PUSH 
  docker:
    name:  Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/invoicerpro-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. DEPLOY TO RENDER 
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy server to Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_SERVER }}"
      - name: Notify success
        run: echo " InvoicerPro deployed at $(date)"